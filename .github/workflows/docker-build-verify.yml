name: Docker Build to GitHub Packages

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Image target to build'
        required: true
        default: app
        type: choice
        options:
          - app
          - db-migrate
          - all
      platforms:
        description: 'Comma-separated target platforms'
        required: true
        default: linux/amd64
        type: string
      release_id:
        description: 'Optional BUILD_VERSION value'
        required: false
        default: release.2026-06-03T15-01-34Z.1831
        type: string
      image_tag:
        description: 'Image tag to publish to GHCR'
        required: false
        default: v1.10.4
        type: string
      publish:
        description: 'Publish image to this fork GHCR only'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - develop
    paths:
      - 'apps/nestjs-backend/**'
      - 'apps/nextjs-app/**'
      - 'packages/**'
      - 'dockers/teable/**'
      - '.github/workflows/docker-build-verify.yml'
      - 'scripts/**'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
      platforms: ${{ steps.defaults.outputs.platforms }}
      release_id: ${{ steps.defaults.outputs.release_id }}
      image_tag: ${{ steps.defaults.outputs.image_tag }}
      publish: ${{ steps.defaults.outputs.publish }}
    steps:
      - name: Resolve defaults
        id: defaults
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          echo "platforms=${INPUT_PLATFORMS:-linux/amd64}" >> "$GITHUB_OUTPUT"
          echo "release_id=${INPUT_RELEASE_ID:-release.2026-06-03T15-01-34Z.1831}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${INPUT_IMAGE_TAG:-v1.10.4}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=${INPUT_PUBLISH:-true}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve target matrix
        id: matrix
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          case "${INPUT_TARGET:-app}" in
            app)
              echo 'targets=[{"name":"app","file":"Dockerfile","image":"teable-custom"}]' >> "$GITHUB_OUTPUT"
              ;;
            db-migrate)
              echo 'targets=[{"name":"db-migrate","file":"Dockerfile.db-migrate","image":"teable-db-migrate-custom"}]' >> "$GITHUB_OUTPUT"
              ;;
            all)
              echo 'targets=[{"name":"app","file":"Dockerfile","image":"teable-custom"},{"name":"db-migrate","file":"Dockerfile.db-migrate","image":"teable-db-migrate-custom"}]' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown target: ${INPUT_TARGET}" >&2
              exit 1
              ;;
          esac

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub container registry
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.target.image }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.image_tag }}
            type=raw,value=${{ needs.prepare.outputs.release_id }}
            type=raw,value=${{ github.sha }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockers/teable/${{ matrix.target.file }}
          platforms: ${{ needs.prepare.outputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ENABLE_CSP=false
            BUILD_VERSION=${{ needs.prepare.outputs.release_id }}
          cache-from: type=gha,scope=verify-${{ matrix.target.name }}
          cache-to: type=gha,mode=max,scope=verify-${{ matrix.target.name }},ignore-error=true
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          provenance: false
