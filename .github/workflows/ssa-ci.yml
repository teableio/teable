name: SSA CI

on:
  push:
    branches:
      - ssa/main
    paths:
      - 'ssa/**'
      - '.github/workflows/ssa-ci.yml'
  pull_request:
    branches:
      - ssa/main
    paths:
      - 'ssa/**'
      - '.github/workflows/ssa-ci.yml'

concurrency:
  group: ssa-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ssa
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ssa/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
